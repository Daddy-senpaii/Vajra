name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
      - "go.work"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
      - "go.work"

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      VAYRA_TEST_MONGODB_URI: mongodb://localhost:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
          cache: true
      - name: Verify module dependencies
        working-directory: backend
        run: go mod verify
      - name: Check formatting
        working-directory: backend
        run: test -z "$(gofmt -l .)"
      - name: Vet
        working-directory: backend
        run: go vet ./...
      - name: Unit and MongoDB integration tests
        working-directory: backend
        run: go test -race ./...
      - name: Build API
        working-directory: backend
        run: go build -o /tmp/vayra-api ./cmd/api
